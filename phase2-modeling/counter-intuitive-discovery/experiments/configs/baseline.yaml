# Baseline Experiment Configuration
# Uses all available features (including conventional engineering metrics)

dataset:
  plugin: battery_dataset
  params:
    data_path: /path/to/battery/data/
    test_size: 0.2
    random_state: 42

model:
  type: elastic_net
  params:
    alpha: 0.1
    l1_ratio: 0.3
    max_iter: 10000
    random_state: 42

training:
  cv_folds: 5
  scoring: neg_mean_absolute_percentage_error

explainability:
  methods:
    - shap
    - permutation
  shap_samples: 100
  permutation_repeats: 10

output:
  save_path: outputs/baseline/
  save_model: true
  save_predictions: true
  save_shap_values: true
